<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="수학 문제를 인식하여 깔끔한 단계별 풀이를 제공합니다.">
<meta name="theme-color" content="#1c6b59">
<title>풀이노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">

<!-- MathJax 라이브러리 (LaTeX 수식 렌더링용) -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: { fontCache: 'global' }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
:root{
  --paper:#f6f8fa; --grid:rgba(38,86,130,.07); --card:#ffffff; --ink:#17212c; --muted:#5a6675;
  --line:#d8dfe7; --accent:#1c6b59; --accent-soft:#e3f1ec; --accent-ink:#ffffff;
  --bad:#c23a2b; --bad-soft:#fbe9e6;
  --f-body:"Noto Sans KR",sans-serif; --f-exam:"Gowun Batang",serif; --f-mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer}
header{display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand-title{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-exam);font-weight:700;font-size:30px}
.brand .tag{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
header p{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:center;justify-content:space-between}
.sec-head h2{font-size:17px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:8px;font-weight:500;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drop{border:1.5px dashed var(--line);border-radius:12px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;color:var(--muted)}
.drop img{max-height:320px;border-radius:8px;object-fit:contain}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pad{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background-color:var(--card)}
.pad canvas{display:block;width:100%;height:280px;touch-action:none;cursor:crosshair}
.pad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
textarea{width:100%;min-height:110px;font:inherit;font-family:var(--f-exam);font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.status.err{border-color:var(--bad);background:var(--bad-soft)}
.status.err .dot{background:var(--bad);animation:none}
@keyframes pulse{50%{opacity:.25}}

/* 풀이 결과 가독성 개선 스타일 */
.result-box{font-family:var(--f-exam);font-size:16px;line-height:1.8;color:var(--ink)}
.result-box h3{font-size:18px;font-weight:700;color:var(--accent);margin-top:20px;margin-bottom:10px;border-bottom:2px solid var(--accent-soft);padding-bottom:6px}
.result-box h3:first-child{margin-top:0}
.result-box p{margin:8px 0}
.result-box ul, .result-box ol{padding-left:20px;margin:8px 0}
.result-box li{margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-title"><h1>풀이노트</h1><span class="tag">고등 수학</span></div>
      <button class="btn" id="api-key-btn">🔑 API 키 설정</button>
    </div>
    <p>문제를 사진으로 찍거나 손글씨로 올리면 핵심 단계별 풀이를 제공합니다.</p>
  </header>

  <section class="card" id="input-card">
    <div class="sec-head"><h2>문제 입력하기</h2><span class="eyebrow">Step 1</span></div>
    <div class="tabs">
      <button id="tab-photo" aria-selected="true" data-mode="photo">사진</button>
      <button id="tab-hand" aria-selected="false" data-mode="hand">손글씨</button>
      <button id="tab-text" aria-selected="false" data-mode="text">직접 입력</button>
    </div>

    <div id="panel-photo">
      <div class="drop">
        <div id="drop-empty">
          <p><strong>문제 사진을 올려 주세요</strong></p>
        </div>
        <img id="photo-preview" hidden>
        <div class="row" style="justify-content:center; margin-top:10px;">
          <label class="btn primary filebtn">카메라로 찍기<input type="file" id="cam-input" accept="image/*" capture="environment"></label>
          <label class="btn filebtn">사진 선택<input type="file" id="photo-input" accept="image/*"></label>
        </div>
      </div>
    </div>

    <div id="panel-hand" hidden>
      <div class="pad">
        <canvas id="pad"></canvas>
        <div class="ph" id="pad-ph">여기에 문제를 써 보세요</div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="pad-undo">되돌리기</button>
        <button class="btn" id="pad-clear">모두 지우기</button>
      </div>
    </div>

    <div id="panel-text" hidden>
      <textarea id="text-input" placeholder="예) y=3x^2+2x+1 의 꼭짓점 좌표를 구하시오."></textarea>
    </div>

    <div class="row end">
      <button class="btn primary" id="go-btn">문제 풀이 시작하기</button>
    </div>
  </section>

  <div class="status" id="status" hidden><i class="dot"></i><span id="status-text"></span></div>

  <section class="card" id="result-card" hidden>
    <div class="sec-head"><h2>AI 문제 풀이 결과</h2></div>
    <div class="result-box" id="result-content"></div>
    <div class="row end" style="margin-top:10px;">
      <button class="btn" id="new-btn">새 문제 풀기</button>
    </div>
  </section>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var userApiKey = localStorage.getItem('gemini_api_key') || '';

  $('api-key-btn').onclick = function(){
    var key = prompt('Gemini API 키를 입력하세요:', userApiKey);
    if (key !== null) {
      userApiKey = key.trim();
      localStorage.setItem('gemini_api_key', userApiKey);
      alert(userApiKey ? 'API 키가 저장되었습니다.' : 'API 키 설정이 해제되었습니다.');
    }
  };

  var mode = 'photo';
  function setMode(m){
    mode = m;
    document.querySelectorAll('.tabs button').forEach(function(b){
      b.setAttribute('aria-selected', b.dataset.mode === m ? 'true' : 'false');
    });
    $('panel-photo').hidden = m !== 'photo';
    $('panel-hand').hidden = m !== 'hand';
    $('panel-text').hidden = m !== 'text';
    if(m === 'hand') sizePad();
  }
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick = function(){ setMode(b.dataset.mode); };
  });

  var photoFile = null;
  function setPhoto(f){
    if(!f) return;
    photoFile = f;
    $('photo-preview').src = URL.createObjectURL(f);
    $('photo-preview').hidden = false;
    $('drop-empty').hidden = true;
  }
  $('photo-input').onchange = function(e){ setPhoto(e.target.files[0]); };
  $('cam-input').onchange = function(e){ setPhoto(e.target.files[0]); };

  var pad = $('pad'), pctx = pad.getContext('2d'), strokes = [], cur = null;
  function sizePad(){
    var r = pad.getBoundingClientRect();
    pad.width = r.width || 300;
    pad.height = 280;
    redraw();
  }
  function redraw(){
    pctx.clearRect(0,0,pad.width,pad.height);
    pctx.lineWidth = 3;
    pctx.strokeStyle = '#17212c';
    strokes.forEach(function(s){
      if(!s.length) return;
      pctx.beginPath();
      pctx.moveTo(s[0][0], s[0][1]);
      for(var i=1; i<s.length; i++) pctx.lineTo(s[i][0], s[i][1]);
      pctx.stroke();
    });
    $('pad-ph').hidden = strokes.length > 0;
  }
  function pt(e){ var r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  pad.addEventListener('pointerdown', function(e){ cur = [pt(e)]; strokes.push(cur); redraw(); });
  pad.addEventListener('pointermove', function(e){ if(cur){ cur.push(pt(e)); redraw(); } });
  pad.addEventListener('pointerup', function(){ cur = null; });
  $('pad-undo').onclick = function(){ strokes.pop(); redraw(); };
  $('pad-clear').onclick = function(){ strokes = []; redraw(); };

  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function textToImageBase64(text){
    var canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 200;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000000'; ctx.font = '20px sans-serif';
    var lines = text.split('\n');
    for(var i=0; i<lines.length; i++){ ctx.fillText(lines[i], 20, 40 + (i * 30)); }
    return canvas.toDataURL('image/png');
  }

  function showStatus(msg, err){
    var s = $('status');
    if(!msg){ s.hidden = true; return; }
    s.hidden = false;
    s.className = 'status' + (err ? ' err' : '');
    $('status-text').textContent = msg;
  }

  // 간단한 마크다운 파서 (가독성 향상)
  function renderMarkdown(text) {
    let html = text
      .replace(/^### (.*$)/gim, '<h3>$1</h3>')
      .replace(/^## (.*$)/gim, '<h3>$1</h3>')
      .replace(/^\*\*([^*]+)\*\*/gim, '<strong>$1</strong>')
      .replace(/\*\*([^*]+)\*\*/gim, '<strong>$1</strong>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    return '<p>' + html + '</p>';
  }

  $('go-btn').onclick = async function(){
    showStatus('AI가 문제 풀이를 작성 중입니다...', false);
    $('result-card').hidden = true;
    $('go-btn').disabled = true;

    try {
      var imageBase64 = '';
      if(mode === 'photo'){
        if(!photoFile) throw new Error('사진을 선택하거나 촬영해 주세요.');
        imageBase64 = await fileToBase64(photoFile);
      } else if(mode === 'hand'){
        if(!strokes.length) throw new Error('손글씨로 문제를 입력해 주세요.');
        imageBase64 = pad.toDataURL('image/png');
      } else if(mode === 'text'){
        var txt = $('text-input').value.trim();
        if(!txt) throw new Error('문제를 입력해 주세요.');
        imageBase64 = textToImageBase64(txt);
      }

      var res = await fetch('./api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageBase64, apiKey: userApiKey })
      });

      var data = await res.json();
      if(!res.ok) throw new Error(data.error || '오류가 발생했습니다.');

      showStatus(null);
      var container = $('result-content');
      container.innerHTML = renderMarkdown(data.result);
      $('result-card').hidden = false;

      // MathJax 수식 렌더링
      if (window.MathJax) {
        MathJax.typesetPromise([container]);
      }

      $('result-card').scrollIntoView({ behavior: 'smooth' });

    } catch(err) {
      showStatus(err.message, true);
    } finally {
      $('go-btn').disabled = false;
    }
  };

  $('new-btn').onclick = function(){
    $('result-card').hidden = true;
    $('input-card').scrollIntoView({ behavior: 'smooth' });
  };
})();
</script>
</body>
</html>
