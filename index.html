<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="수학 문제를 사진·손글씨로 인식하고 힌트부터 단계별 풀이, 개념, 유사문제를 보여주는 풀이 앱">
<meta name="theme-color" content="#1c6b59">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="풀이노트">
<title>풀이노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 모눈종이 위의 한 줄짜리 풀이 노트 */
:root{
  --paper:#f6f8fa; --grid:rgba(38,86,130,.07); --card:#ffffff; --ink:#17212c; --muted:#5a6675;
  --line:#d8dfe7; --accent:#1c6b59; --accent-soft:#e3f1ec; --accent-ink:#ffffff;
  --mark:#fff0a3; --good:#1e7a3c; --good-soft:#e5f4e9; --bad:#c23a2b; --bad-soft:#fbe9e6;
  --lock:#eef1f4;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-exam:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151b; --grid:rgba(140,180,220,.06); --card:#17202a; --ink:#e6ecf2; --muted:#9aa7b5;
  --line:#2a3743; --accent:#4cc3a0; --accent-soft:#18332c; --accent-ink:#0a1b16;
  --mark:rgba(255,214,70,.22); --good:#5fd08a; --good-soft:#15301f; --bad:#ff8a7a; --bad-soft:#3a1d1a;
  --lock:#1b252f; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10151b; --grid:rgba(140,180,220,.06); --card:#17202a; --ink:#e6ecf2; --muted:#9aa7b5;
  --line:#2a3743; --accent:#4cc3a0; --accent-soft:#18332c; --accent-ink:#0a1b16;
  --mark:rgba(255,214,70,.22); --good:#5fd08a; --good-soft:#15301f; --bad:#ff8a7a; --bad-soft:#3a1d1a;
  --lock:#1b252f; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand-title{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-exam);font-weight:700;font-size:30px;letter-spacing:-.01em}
.brand .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
header p{color:var(--muted);font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:17px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:8px;font-weight:500;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.drop{border:1.5px dashed var(--line);border-radius:12px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;position:relative}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{max-height:320px;border-radius:8px;object-fit:contain}
.drop strong{color:var(--ink);font-weight:500}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.small{font-size:12.5px;color:var(--muted)}

.pad{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.pad canvas{display:block;width:100%;height:280px;touch-action:none;cursor:crosshair}
.pad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

textarea{width:100%;min-height:110px;resize:vertical;font:inherit;font-family:var(--f-exam);font-size:16px;line-height:1.7;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
input[type=text]{flex:1 1 180px;min-width:0;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.1s ease-in-out infinite}
.status.err{border-color:var(--bad);background:var(--bad-soft)}
.status.err .dot{background:var(--bad);animation:none}
.status span{flex:1;min-width:0}
@keyframes pulse{50%{opacity:.25}}

.result-box{white-space:pre-wrap;word-break:break-word;font-family:var(--f-exam);font-size:16px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-title">
        <h1>풀이노트</h1>
        <span class="tag">고등 수학</span>
      </div>
      <button class="btn" id="api-key-btn">🔑 API 키 설정</button>
    </div>
    <p>문제를 사진으로 찍거나 손글씨로 올리면 AI가 단계별 풀이와 해설을 제공합니다.</p>
  </header>

  <!-- 1. 입력 -->
  <section class="card" id="input-card">
    <div class="sec-head"><h2>문제 입력하기</h2><span class="eyebrow">Step 1</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-photo" aria-selected="true" data-mode="photo">사진</button>
      <button role="tab" id="tab-hand" aria-selected="false" data-mode="hand">손글씨</button>
      <button role="tab" id="tab-text" aria-selected="false" data-mode="text">직접 입력</button>
    </div>

    <!-- 사진 입력 -->
    <div id="panel-photo">
      <div class="drop" id="drop">
        <div id="drop-empty">
          <p><strong>문제 사진을 올려 주세요</strong></p>
          <p class="small">사진 선택이나 끌어놓기(Drag & Drop)를 이용하세요.</p>
        </div>
        <img id="photo-preview" alt="올린 문제 사진" hidden>
        <div class="row" style="justify-content:center; margin-top:10px;">
          <label class="btn primary filebtn">카메라로 찍기<input type="file" id="cam-input" accept="image/*" capture="environment"></label>
          <label class="btn filebtn">사진 선택<input type="file" id="photo-input" accept="image/*"></label>
        </div>
      </div>
    </div>

    <!-- 손글씨 입력 -->
    <div id="panel-hand" hidden>
      <div class="pad">
        <canvas id="pad"></canvas>
        <div class="ph" id="pad-ph">여기에 문제를 써 보세요</div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="pad-undo">되돌리기</button>
        <button class="btn" id="pad-clear">모두 지우기</button>
      </div>
    </div>

    <!-- 텍스트 입력 -->
    <div id="panel-text" hidden>
      <textarea id="text-input" placeholder="예) 이차함수 y=x^2-4x+k 의 그래프가 x축과 서로 다른 두 점에서 만나도록 하는 k의 범위를 구하시오."></textarea>
    </div>

    <div class="row end">
      <button class="btn primary" id="go-btn">문제 풀이 시작하기</button>
    </div>
  </section>

  <!-- 상태 안내 -->
  <div class="status" id="status" hidden><i class="dot"></i><span id="status-text"></span></div>

  <!-- 2. 결과 출력 -->
  <section class="card" id="result-card" hidden>
    <div class="sec-head"><h2>AI 문제 풀이 결과</h2></div>
    <div class="result-box" id="result-content"></div>
    <div class="row end" style="margin-top:10px;">
      <button class="btn" id="new-btn">새 문제 풀기</button>
    </div>
  </section>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  // API 키 로컬 스토리지 관리
  var userApiKey = localStorage.getItem('gemini_api_key') || '';

  $('api-key-btn').onclick = function(){
    var key = prompt('Google Gemini API 키를 입력하세요 (Vercel 환경 변수가 설정된 경우 비워두셔도 됩니다):', userApiKey);
    if (key !== null) {
      userApiKey = key.trim();
      localStorage.setItem('gemini_api_key', userApiKey);
      alert(userApiKey ? 'API 키가 저장되었습니다.' : 'API 키 설정이 해제되었습니다.');
    }
  };

  // 탭 전환
  var mode = 'photo';
  function setMode(m){
    mode = m;
    document.querySelectorAll('.tabs button').forEach(function(b){
      b.setAttribute('aria-selected', b.dataset.mode === m ? 'true' : 'false');
    });
    $('panel-photo').hidden = m !== 'photo';
    $('panel-hand').hidden = m !== 'hand';
    $('panel-text').hidden = m !== 'text';
    if(m === 'hand') sizePad();
  }
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick = function(){ setMode(b.dataset.mode); };
  });

  // 사진 처리
  var photoFile = null;
  function setPhoto(f){
    if(!f) return;
    photoFile = f;
    var img = $('photo-preview');
    img.src = URL.createObjectURL(f);
    img.hidden = false;
    $('drop-empty').hidden = true;
  }
  $('photo-input').onchange = function(e){ setPhoto(e.target.files[0]); };
  $('cam-input').onchange = function(e){ setPhoto(e.target.files[0]); };

  // 손글씨 패드
  var pad = $('pad'), pctx = pad.getContext('2d'), strokes = [], cur = null;
  function sizePad(){
    var r = pad.getBoundingClientRect();
    pad.width = r.width || 300;
    pad.height = 280;
    redraw();
  }
  function redraw(){
    pctx.clearRect(0,0,pad.width,pad.height);
    pctx.lineWidth = 3;
    pctx.strokeStyle = '#17212c';
    strokes.forEach(function(s){
      if(!s.length) return;
      pctx.beginPath();
      pctx.moveTo(s[0][0], s[0][1]);
      for(var i=1; i<s.length; i++) pctx.lineTo(s[i][0], s[i][1]);
      pctx.stroke();
    });
    $('pad-ph').hidden = strokes.length > 0;
  }
  function pt(e){ var r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  pad.addEventListener('pointerdown', function(e){ cur = [pt(e)]; strokes.push(cur); redraw(); });
  pad.addEventListener('pointermove', function(e){ if(cur){ cur.push(pt(e)); redraw(); } });
  pad.addEventListener('pointerup', function(){ cur = null; });
  $('pad-undo').onclick = function(){ strokes.pop(); redraw(); };
  $('pad-clear').onclick = function(){ strokes = []; redraw(); };

  function getCanvasImageData(){
    if(!strokes.length) return null;
    return pad.toDataURL('image/png');
  }

  // File/Blob -> Base64
  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // 텍스트를 이미지(Canvas)로 전환 (텍스트 처리용)
  function textToImageBase64(text){
    var canvas = document.createElement('canvas');
    canvas.width = 600;
    canvas.height = 200;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000000';
    ctx.font = '20px sans-serif';
    
    var lines = text.split('\n');
    for(var i=0; i<lines.length; i++){
      ctx.fillText(lines[i], 20, 40 + (i * 30));
    }
    return canvas.toDataURL('image/png');
  }

  function showStatus(msg, err){
    var s = $('status');
    if(!msg){ s.hidden = true; return; }
    s.hidden = false;
    s.className = 'status' + (err ? ' err' : '');
    $('status-text').textContent = msg;
  }

  // 서버 API 호출
  $('go-btn').onclick = async function(){
    showStatus('AI가 문제를 분석 중입니다...', false);
    $('result-card').hidden = true;
    $('go-btn').disabled = true;

    try {
      var imageBase64 = '';

      if(mode === 'photo'){
        if(!photoFile) throw new Error('사진을 선택하거나 촬영해 주세요.');
        imageBase64 = await fileToBase64(photoFile);
      } else if(mode === 'hand'){
        imageBase64 = getCanvasImageData();
        if(!imageBase64) throw new Error('손글씨로 문제를 입력해 주세요.');
      } else if(mode === 'text'){
        var txt = $('text-input').value.trim();
        if(!txt) throw new Error('문제를 입력해 주세요.');
        imageBase64 = textToImageBase64(txt);
      }

      var res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image: imageBase64,
          apiKey: userApiKey
        })
      });

      var data = await res.json();

      if(!res.ok){
        throw new Error(data.error || '문제풀이 생성 중 오류가 발생했습니다.');
      }

      showStatus(null);
      $('result-content').textContent = data.result;
      $('result-card').hidden = false;
      $('result-card').scrollIntoView({ behavior: 'smooth' });

    } catch(err) {
      showStatus(err.message, true);
    } finally {
      $('go-btn').disabled = false;
    }
  };

  $('new-btn').onclick = function(){
    $('result-card').hidden = true;
    $('input-card').scrollIntoView({ behavior: 'smooth' });
  };
})();
</script>
</body>
</html>
